<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pane, Files tab</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7aa2f7}a:hover{color:#a9c1fa}
</style>
</helmet>
<div style="width: 560px; height: 760px; box-sizing: border-box; background: #16181d; color: #d6d9e0; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 22px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-direction: row; gap: 8px">
<button style="font: inherit; background: transparent; color: #d6d9e0; border: 0; padding: 0px 8px">1 Tasks</button>
<button style="font: inherit; background: transparent; color: #d6d9e0; border: 0; padding: 0px 8px">2 Agents</button>
<button style="font: inherit; background: transparent; color: #d6d9e0; border: 0; padding: 0px 8px">3 Timeline</button>
<button style="font: inherit; background: #7aa2f7; color: #16181d; border: 0; border-radius: 3px; padding: 0px 8px; font-weight: 700">4 Files</button>
</div>
<div style="border-top: 1px solid #4a5165"></div>

<div style="display: flex; flex-direction: column; white-space: pre">
<div><span style="color: #e0af68">~</span> src/server/middleware/index.ts          <span style="color: #9aa3b5">×2  now</span></div>
<div style="background: #262a35"><span style="color: #9ece6a">+</span> test/rateLimit.test.ts                  <span style="color: #9aa3b5">×3  1m</span></div>
<div><span style="color: #9ece6a">+</span> src/server/middleware/rateLimit.ts      <span style="color: #9aa3b5">×2  3m</span></div>
<div><span style="color: #e0af68">~</span> src/server/upload.ts                    <span style="color: #9aa3b5">    4m</span></div>
<div><span style="color: #7aa2f7">↗</span> claude.ai/artifact/… Rate limit design  <span style="color: #9aa3b5">    9m</span></div>
</div>

<div style="display: flex; flex-direction: column; white-space: pre; color: #9aa3b5">
<div>+ created   ~ edited   ↗ published</div>
<div>×n  how many steps touched it</div>
</div>

<div style="flex-grow: 1"></div>
<div style="color: #9aa3b5; white-space: pre">↑↓ move · enter shows the steps that touched the file</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":760}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}

</body>
</html>
